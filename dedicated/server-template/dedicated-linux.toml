# Project Renaissance dedicated servers for Halo: Reach - Linux
#
# Start every server below with:
#     ./project-renaissance-dedicated dedicated
# Check every server and print what would run, without starting or writing:
#     ./project-renaissance-dedicated dedicated --dry-run
# Check the setup without starting servers:
#     ./project-renaissance-dedicated check
# List the maps and game types you can name below and in playlists:
#     ./project-renaissance-dedicated content
# Guide: README.md next to this file (and the notes in this folder).
#
# Reach Renaissance is a Windows program; this host runs it through Wine or
# Proton, so the paths below are Linux paths and the engine is handed the
# Windows form of them (Z:\...).

# The Reach Renaissance folder that holds bin/host-probe.exe (the unzipped
# release in your home folder).
game = '~/Games/ReachRenaissance'

# Where Halo: Reach lives, if host-probe can't find your Steam install itself.
#mcc = '~/.steam/steam/steamapps/common/Halo The Master Chief Collection'

# What starts the Windows engine. Left out, "wine" from PATH is used. Name a
# Proton command line (or a wrapper script of your own) to use something else:
#runner = "/home/you/.steam/steam/steamapps/common/Proton - Experimental/proton run"
# The Wine prefix that runner uses, and where C:\ paths inside playlists are
# looked up. Left out: WINEPREFIX, else ~/.wine.
#wine_prefix = '~/.wine'
# Where the client keeps fileshare/ and playlists/ (inside the prefix). Left
# out, this host searches ~/.local/share/ReachRenaissance, the Wine prefix and
# the Proton prefixes it can find.
#client_data = '~/.steam/steam/steamapps/compatdata/976730/pfx/drive_c/users/steamuser/AppData/Local/ReachRenaissance'

# Maps, game types and mods shared by every server:
#   content/Game Modes   .bin game variants       (a playlist's "game")
#   content/Maps         saved Forge maps, .mvar  (a playlist's "map_variant")
#   content/Mods         one folder per custom .map, with its .mapinfo
content = "content"
data = "data"
bans = "bans.json"

# The server list every server with public = true registers with, so players find
# it in the game's own browser. This is Reach Renaissance's list.
master = "https://2-29-30-1.sslip.io:11700"

# Ask each server's router to open its game port (UPnP). Leave off when you
# forward the ports yourself or the host is a virtual machine.
upnp = false

# Restart every server when the game updates under it (VERSION.txt or
# bin/host-probe.exe changes), so nobody meets a server running a build players
# have moved off. On by default.
#restart_on_update = false

# Used by servers that don't set their own name below.
host_name = "Dedicated server"

# RCON: read and run the servers from an admin panel (Source RCON), one port per
# server, its own game port number by default. Off until you set a password.
# Commands: status, players, say, kick, ban, unban, bans, endgame, endround,
# next, restart, reload, help.
[rcon]
password = "change-me"
# Where RCON listens. 127.0.0.1 is this machine only; 0.0.0.0 lets another
# machine or a panel in Docker reach it, and anyone else who finds the port.
bind = "127.0.0.1"
# What a panel should connect to. This host doesn't read it.
address = "127.0.0.1"

# Announcements: one line from the server into the players' in-game chat, every
# so many minutes. It is the engine's own match chat underneath (the same path as
# `say` over RCON), so it is only said while someone is in the server. Several
# messages under `messages` are said in turn; every_minutes = 0 turns it off.
#[announce]
#every_minutes = 10
#message = "Welcome! Join our discord at https://discord.gg/example"

# Used by every server unless its own [[server]] block says otherwise.
[defaults]
# List each server where players' matchmaking server list shows it.
public = true
# Also answer on your own network, so players in your house join directly.
lan = true
# Players each server admits at once. 33 and up needs big_lobby = 64.
max_players = 16
# The engine's lobby capacity. Leave it out to keep it the same as max_players.
#capacity = 16
# Minutes a game may run.
time_limit = 12
# Leave a game alone when someone joins it. On, this host ends that game for the
# joiner while their client is still loading it, and the join is dropped (or it
# loads the next map and faults). Off, a join is just a join. README.md explains.
#fresh_game_on_join = false
# Seconds a late joiner gets before that game is ended, when the line above is on.
#fresh_game_join_delay = 2
# Reach Renaissance's big-lobby patch: 64 admits up to 64 players, 0 is off.
#big_lobby = 64
# Custom map folders every server loads (names under content/Mods, or paths).
#mods = []

# One [[server]] block per server. Every server needs a unique name and its own
# UDP game port; 40011 through 40013 are the ports hosting uses by default.
[[server]]
name = "Renaissance Slayer"
port = 40011
playlist = "playlists/slayer.playlist.json"

# A server that plays one map and game type instead of a playlist:
#[[server]]
#name = "Renaissance ForgeWorld"
#port = 40012
#map = "ForgeWorld"
#game = "Slayer"
#map_variant = "Maps/mymap.mvar"    # optional: a saved Forge map

# A [[server]] block may override from [defaults]: public, lan, max_players,
# capacity, time_limit, upnp, mods, fresh_game_on_join, fresh_game_join_delay,
# and its own admin_port, rcon_port, rcon and enabled.
